<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DarziDesk</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #006A67;
            --primary-dark: #004D4B;
            --text-dark: #0B1C30;
            --text-muted: #6D7978;
            --card-border: #E0E7E7;
            --bg-gradient: radial-gradient(circle at top left, #F0F9F9 0%, #F8F9FF 100%);
            --font-main: 'Hanken Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-dark);
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon-box {
            width: 48px;
            height: 48px;
            background: var(--primary-teal);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            margin: 0 auto 12px;
            box-shadow: 0 4px 12px rgba(0, 106, 103, 0.2);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .card-container {
            background: #FFFFFF;
            border-radius: 18px;
            border-top: 4px solid var(--primary-teal);
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            padding: 40px 36px;
            max-width: 460px;
            width: 100%;
        }

        .card-container h3 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .card-container p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group .material-symbols-outlined {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--card-border);
            background: #F8F9FA;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-teal);
            background: #FFFFFF;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary-teal);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
        }

        .back-link {
            display: block;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-teal);
        }

        .divider-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 36px 0 24px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .divider-icons::before, .divider-icons::after {
            content: '';
            width: 100px;
            border-bottom: 1px solid var(--card-border);
        }

        .copyright-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Logo Badge -->
    <div class="header-brand">
        <img src="assets/images/logo_wide.png" alt="DarziDesk" style="height: 42px; margin-bottom: 6px;">
        <div class="brand-subtitle">Tailored Precision for Master Artisans</div>
    </div>

    <!-- Main Card Container -->
    <div class="card-container">
        <h3>Forgot Password?</h3>
        <p>Enter your email to receive a password reset link. We'll help you get back to your workshop in no time.</p>

        <form action="login.html" method="GET">
            <div class="form-group">
                <label>WORKSHOP EMAIL</label>
                <div class="input-group">
                    <span class="material-symbols-outlined">mail</span>
                    <input type="email" value="artisan@darzidesk.com" placeholder="artisan@darzidesk.com" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Send Reset Link
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
            </button>
        </form>

        <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <!-- Icons Divider -->
    <div class="divider-icons">
        <span class="material-symbols-outlined" style="font-size: 16px;">content_cut</span>
        <span class="material-symbols-outlined" style="font-size: 16px;">straighten</span>
        <span class="material-symbols-outlined" style="font-size: 16px;">check_circle</span>
    </div>

    <!-- Copyright Footer -->
    <div class="copyright-text">
        © 2024 DarziDesk Bespoke Technologies. All rights reserved.
    </div>

</body>
</html>
